# INACTIVE TEMPLATE - GitHub only runs workflows under .github/workflows/.
# To activate (requires approval; see docs/OPERATIONS_AND_SECURITY.md section 4):
#   1. add the repository secret DATABASE_URL (Render External Database URL)
#      and allow GitHub runners in Render's database Access Control;
#   2. copy this file to .github/workflows/prediction-jobs.yml.
# GitHub may start scheduled runs late; every job is idempotent and the
# second trigger of each pair is a retry. TODAY_CONFIRMED is not scheduled
# here (needs an approved intraday feed and a punctual scheduler).
name: StockLens Prediction v2 (shadow)

on:
  schedule:
    - cron: "0 3 * * 1-5"      # 08:30 IST TODAY_PREOPEN
    - cron: "20 3 * * 1-5"     # 08:50 IST TODAY_PREOPEN retry
    - cron: "0 13 * * 1-5"     # 18:30 IST outcomes + shadow exit states
    - cron: "0 14 * * 1-5"     # 19:30 IST TOMORROW_EOD
    - cron: "45 14 * * 1-5"    # 20:15 IST TOMORROW_EOD retry
    - cron: "10 15 * * 1-5"    # 20:40 IST missed-snapshot monitor
  workflow_dispatch:
    inputs:
      job:
        description: "Job (same calendar-aware protections as the schedule)"
        required: true
        type: choice
        options: [predict_preopen, predict_eod, prediction_outcomes, prediction_monitor]

concurrency:
  group: stocklens-prediction-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.repository == 'Himanshu11007/stock-prediction-app'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      ENGINE_RUN_ALLOW_ML: "false"
      ENGINE_RUN_MAX_WORKERS: "2"
      PREDICTION_V2_PUBLIC: "false"
      PREDICTION_V2_INTRADAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Select job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "${{ github.event.schedule }}" in
            "0 3 * * 1-5"|"20 3 * * 1-5") echo "job=predict_preopen" >> "$GITHUB_OUTPUT" ;;
            "0 13 * * 1-5") echo "job=prediction_outcomes" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * 1-5"|"45 14 * * 1-5") echo "job=predict_eod" >> "$GITHUB_OUTPUT" ;;
            "10 15 * * 1-5") echo "job=prediction_monitor" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown schedule"; exit 1 ;;
          esac
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "::error::DATABASE_URL secret is not set"; exit 1; fi
          python scripts/scheduled_jobs.py "${{ steps.pick.outputs.job }}"
