# Render Blueprint for the StockLens backend (docs/DEPLOY_RENDER.md).
# Render → New → Blueprint → select this repository → Apply.
#
# Creates: PostgreSQL database, the API web service (HTTPS), and the
# scheduled jobs from docs/SCHEDULING.md. Secrets are generated by Render
# (JWT_SECRET_KEY) or linked from the database; nothing secret is committed.
# Region: Singapore (closest Render region to India). Schedules are UTC
# (IST = UTC+05:30).

databases:
  - name: stocklens-db
    databaseName: stocklens
    user: stocklens
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

envVarGroups:
  - name: stocklens-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      # Starter instances have 512 MB: a full 299-stock run peaks at ~370 MB
      # with the informational ML signal off and 2 worker threads (~480 MB with
      # ML on). ML has weight 0 in the score; keep it off on 512 MB plans.
      - key: ENGINE_RUN_MAX_WORKERS
        value: "2"
      - key: ENGINE_RUN_ALLOW_ML
        value: "false"

services:
  - type: web
    name: stocklens-api
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements-cloud.txt
    # Schema migrations run before each new version goes live.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: stocklens-shared
      - key: DATABASE_URL
        fromDatabase:
          name: stocklens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Google Sign-In: OAuth Web-application client id (docs/AUTHENTICATION.md).
      # Render asks for the value in the dashboard; it is not stored here.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # The mobile app is a native client (CORS does not apply); browsers may
      # only call the API from its own origin. Update if a web front end is added.
      - key: CORS_ALLOWED_ORIGINS
        value: https://stocklens-api.onrender.com
      # Optional, set in the Render dashboard when available (docs/NOTIFICATIONS.md):
      # FCM_PROJECT_ID, FCM_SERVICE_ACCOUNT_FILE, APNS_*, OTP_SMTP_* .

  # Daily ranking after the NSE close: every 15 minutes 16:00-20:00 IST, Mon-Fri.
  # The job itself checks holidays, the 16:00 IST cut-off, data availability
  # and "already ran today", so extra invocations are no-ops.
  - type: cron
    name: stocklens-ranking
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "*/15 10-14 * * 1-5"
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python scripts/scheduled_jobs.py ranking
    envVars:
      - fromGroup: stocklens-shared
      - key: DATABASE_URL
        fromDatabase:
          name: stocklens-db
          property: connectionString

  # Current prices of the universe: every 15 minutes 08:30-16:15 IST, Mon-Fri
  # (separate from the ranking reference prices; the job skips holidays).
  - type: cron
    name: stocklens-prices
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "*/15 3-10 * * 1-5"
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python scripts/scheduled_jobs.py prices
    envVars:
      - fromGroup: stocklens-shared
      - key: DATABASE_URL
        fromDatabase:
          name: stocklens-db
          property: connectionString

  # Daily summaries (each user's chosen time) and pushes held for quiet hours.
  - type: cron
    name: stocklens-notifications
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python scripts/scheduled_jobs.py notifications
    envVars:
      - fromGroup: stocklens-shared
      - key: DATABASE_URL
        fromDatabase:
          name: stocklens-db
          property: connectionString

  # Prospective ranking outcomes, 21:00 IST daily.
  - type: cron
    name: stocklens-outcomes
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "30 15 * * *"
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: python scripts/scheduled_jobs.py outcomes
    envVars:
      - fromGroup: stocklens-shared
      - key: DATABASE_URL
        fromDatabase:
          name: stocklens-db
          property: connectionString
