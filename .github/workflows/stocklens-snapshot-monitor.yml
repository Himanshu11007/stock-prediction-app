# StockLens scheduler: SNAPSHOT_MONITOR
#   missing / failed snapshot check. The run FAILS (red) when a snapshot is missing or failed, or the
#   holiday calendar is not configured - it is never reported as a success.
#
# Inactive by default. It never runs on push or pull_request. Scheduled runs
# only happen from the default branch (GitHub rule) AND when the repository
# variable STOCKLENS_SCHEDULER_ENABLED is 'true'. Times are UTC; IST = UTC+05:30.
# Weekends are excluded here; NSE holidays and data readiness are checked by
# the backend (SKIPPED, exit 0). The backend does all calculations: this
# workflow only calls the authenticated job interface (docs/SCHEDULER.md).
name: "StockLens scheduler: SNAPSHOT_MONITOR"

on:
  schedule:
    - cron: "15 4 * * 1-5"   # 09:45 IST, Mon-Fri
    - cron: "15 16 * * 1-5"   # 21:45 IST, Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stocklens-snapshot-monitor
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || vars.STOCKLENS_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stocklens-scheduler
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/scheduler_client.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Trigger SNAPSHOT_MONITOR in the StockLens backend
        env:
          STOCKLENS_API_URL: ${{ vars.STOCKLENS_API_URL }}
          STOCKLENS_SCHEDULER_TOKEN: ${{ secrets.STOCKLENS_SCHEDULER_TOKEN }}
        run: python3 scripts/scheduler_client.py --job SNAPSHOT_MONITOR --timeout-minutes 5
