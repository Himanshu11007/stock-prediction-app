# StockLens scheduler: TODAY_PREOPEN
#   v2 pre-open snapshot (shadow). Data cutoff: previous close plus news ingested by then. Must start
#   before 09:15 IST (a late start is skipped, never published after the open).
#
# Inactive by default. It never runs on push or pull_request. Scheduled AND
# manual (workflow_dispatch) runs both need the repository variable
# STOCKLENS_SCHEDULER_ENABLED == 'true': a manual run cannot bypass the switch.
# Scheduled runs also only happen from the default branch (GitHub rule).
# Times are UTC; IST = UTC+05:30.
# Weekends are excluded here; NSE holidays and data readiness are checked by
# the backend (SKIPPED, exit 0). The backend does all calculations: this
# workflow only calls the authenticated job interface (docs/SCHEDULER.md).
name: "StockLens scheduler: TODAY_PREOPEN"

on:
  schedule:
    - cron: "7 2 * * 1-5"   # 07:37 IST, Mon-Fri (early: GitHub can start runs hours late)
    - cron: "37 2 * * 1-5"   # 08:07 IST, retry (no-op if done), Mon-Fri
    - cron: "7 3 * * 1-5"   # 08:37 IST, retry (no-op if done), Mon-Fri
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stocklens-today-preopen
  cancel-in-progress: false

jobs:
  trigger:
    if: vars.STOCKLENS_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: stocklens-scheduler
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/scheduler_client.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Trigger TODAY_PREOPEN in the StockLens backend
        env:
          STOCKLENS_API_URL: ${{ vars.STOCKLENS_API_URL }}
          STOCKLENS_SCHEDULER_TOKEN: ${{ secrets.STOCKLENS_SCHEDULER_TOKEN }}
        run: python3 scripts/scheduler_client.py --job TODAY_PREOPEN --timeout-minutes 20
